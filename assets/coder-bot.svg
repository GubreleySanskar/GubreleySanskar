<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <style>
    .bob   { animation: bob 2.4s ease-in-out infinite; transform-origin: 200px 150px; }
    .blink { animation: blink 4s infinite; transform-origin: center; transform-box: fill-box; }
    .armL  { animation: typeL .35s ease-in-out infinite alternate; transform-origin: 150px 165px; }
    .armR  { animation: typeR .35s ease-in-out infinite alternate; transform-origin: 250px 165px; }
    .ant   { animation: glow 1.2s ease-in-out infinite alternate; }
    .line  { animation: grow 3s steps(12) infinite; }
    .l2 { animation-delay: .6s; } .l3 { animation-delay: 1.2s; } .l4 { animation-delay: 1.8s; }
    .steam { animation: steam 2.5s ease-out infinite; opacity: 0; }
    .s2 { animation-delay: .8s; } .s3 { animation-delay: 1.6s; }
    .zap { animation: zap 1.6s steps(2) infinite; }
    @keyframes bob   { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
    @keyframes typeL { from { transform: rotate(-6deg) } to { transform: rotate(6deg) } }
    @keyframes typeR { from { transform: rotate(6deg) }  to { transform: rotate(-6deg) } }
    @keyframes glow  { from { fill: #ff4ecd } to { fill: #39ffb6 } }
    @keyframes grow  { 0% { width: 0 } 70%,100% { width: 70px } }
    @keyframes steam { 0% { opacity: 0; transform: translateY(0) } 30% { opacity: .8 } 100% { opacity: 0; transform: translateY(-22px) } }
    @keyframes zap   { 0% { opacity: 1 } 50% { opacity: 0 } }
  </style>

  <!-- desk -->
  <rect x="40" y="200" width="320" height="14" rx="4" fill="#2b2d42"/>
  <rect x="60" y="214" width="10" height="40" fill="#2b2d42"/>
  <rect x="330" y="214" width="10" height="40" fill="#2b2d42"/>

  <!-- coffee mug -->
  <rect x="300" y="176" width="26" height="24" rx="4" fill="#ff9f1c"/>
  <path d="M326 182 q10 0 10 8 t-10 8" stroke="#ff9f1c" stroke-width="4" fill="none"/>
  <path class="steam"    d="M306 170 q4 -6 0 -12" stroke="#9aa5b1" stroke-width="2" fill="none"/>
  <path class="steam s2" d="M313 170 q4 -6 0 -12" stroke="#9aa5b1" stroke-width="2" fill="none"/>
  <path class="steam s3" d="M320 170 q4 -6 0 -12" stroke="#9aa5b1" stroke-width="2" fill="none"/>

  <!-- robot -->
  <g class="bob">
    <line x1="200" y1="62" x2="200" y2="44" stroke="#8d99ae" stroke-width="4"/>
    <circle class="ant" cx="200" cy="40" r="7" fill="#ff4ecd"/>
    <rect x="150" y="62" width="100" height="72" rx="18" fill="#5e60ce"/>
    <rect x="162" y="76" width="76" height="40" rx="10" fill="#0b0c1a"/>
    <ellipse class="blink" cx="184" cy="96" rx="8" ry="9" fill="#39ffb6"/>
    <ellipse class="blink" cx="216" cy="96" rx="8" ry="9" fill="#39ffb6"/>
    <path d="M190 124 q10 6 20 0" stroke="#0b0c1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="160" y="138" width="80" height="54" rx="14" fill="#4ea8de"/>
    <circle cx="200" cy="164" r="9" fill="#0b0c1a"/>
    <path class="zap" d="M201 157 l-5 8 h5 l-2 7 l6 -9 h-5 z" fill="#ffd60a"/>
    <g class="armL"><rect x="128" y="150" width="34" height="12" rx="6" fill="#5e60ce"/></g>
    <g class="armR"><rect x="238" y="150" width="34" height="12" rx="6" fill="#5e60ce"/></g>
  </g>

  <!-- laptop -->
  <polygon points="110,200 290,200 270,180 130,180" fill="#adb5bd"/>
  <rect x="68" y="180" width="14" height="20" fill="#8d99ae"/>
  <rect x="50" y="196" width="50" height="5" rx="2" fill="#8d99ae"/>
  <rect x="20" y="90" width="110" height="90" rx="8" fill="#0b0c1a" stroke="#5e60ce" stroke-width="3"/>
  <circle cx="32" cy="100" r="3" fill="#ff5f56"/><circle cx="42" cy="100" r="3" fill="#ffbd2e"/><circle cx="52" cy="100" r="3" fill="#27c93f"/>
  <rect class="line"    x="30" y="114" width="70" height="6" rx="3" fill="#39ffb6"/>
  <rect class="line l2" x="40" y="128" width="55" height="6" rx="3" fill="#ff4ecd"/>
  <rect class="line l3" x="40" y="142" width="60" height="6" rx="3" fill="#4ea8de"/>
  <rect class="line l4" x="30" y="156" width="45" height="6" rx="3" fill="#ffd60a"/>
</svg>
